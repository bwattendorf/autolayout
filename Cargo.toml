[workspace]
resolver = "2"
members = ["crates/sexpr", "crates/board", "crates/grade", "crates/place", "crates/route", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bwattendorf/autolayout"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
